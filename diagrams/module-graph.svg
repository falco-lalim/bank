<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    .module { fill:#f2f8ff; stroke:#2b6ea3; stroke-width:2; rx:8; }
    .label { font-family: Arial, sans-serif; font-size:13px; fill:#083b5c; }
    .arrow { stroke:#444; stroke-width:2; marker-end: url(#arrowhead); }
    .note { font-family: Arial, sans-serif; font-size:12px; fill:#222; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#444" />
    </marker>
  </defs>

  <!-- Modules -->
  <rect class="module" x="40" y="30" width="180" height="60" />
  <text class="label" x="130" y="60" text-anchor="middle">bank.app</text>
  <text class="note" x="130" y="76" text-anchor="middle">(Main)</text>

  <rect class="module" x="300" y="30" width="160" height="60" />
  <text class="label" x="380" y="60" text-anchor="middle">bank.api</text>
  <text class="note" x="380" y="76" text-anchor="middle">(interfaces)</text>

  <rect class="module" x="560" y="10" width="180" height="80" />
  <text class="label" x="650" y="45" text-anchor="middle">bank.core</text>
  <text class="note" x="650" y="61" text-anchor="middle">(checking impl)</text>

  <rect class="module" x="300" y="140" width="180" height="60" />
  <text class="label" x="390" y="170" text-anchor="middle">bank.security</text>
  <text class="note" x="390" y="186" text-anchor="middle">(auth provider)</text>

  <rect class="module" x="560" y="140" width="180" height="60" />
  <text class="label" x="650" y="170" text-anchor="middle">bank.plugin.savings</text>
  <text class="note" x="650" y="186" text-anchor="middle">(savings plugin)</text>

  <!-- Arrows: requires -->
  <path class="arrow" d="M220 60 L300 60" />
  <text class="note" x="260" y="52" text-anchor="middle">requires</text>

  <path class="arrow" d="M460 60 L560 60" />
  <text class="note" x="510" y="52" text-anchor="middle">requires</text>

  <path class="arrow" d="M460 170 L560 170" />
  <text class="note" x="510" y="162" text-anchor="middle">requires</text>

  <!-- provides / uses (dashed) -->
  <path stroke="#b33" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowhead)" d="M650 90 L650 140" />
  <text class="note" x="660" y="115">provides AccountFactory</text>

  <path stroke="#b33" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowhead)" d="M380 90 L380 140" />
  <text class="note" x="330" y="115">uses AuthenticationService</text>

  <path stroke="#2b6ea3" stroke-width="1.5" fill="none" d="M380 170 L560 170" marker-end="url(#arrowhead)" />
  <text class="note" x="470" y="180" text-anchor="middle">module-path (providers)</text>

  <!-- Legend -->
  <rect x="20" y="320" width="860" height="60" rx="6" fill="#fff7e6" stroke="#e6a800" />
  <text class="note" x="40" y="340">Legend: solid arrow = requires/depends, dashed = provides/uses (ServiceLoader), blue box = module</text>
</svg>

